<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shaurya Chaudhary | Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;300&family=Manrope:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <style>

:root {
  --void: #08080a;
  --ash: #a9a39a;
  --bone: #f2ece2;
  --ember: #e9a95c;
  --line: rgba(242, 236, 226, 0.14);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--void);
  color: var(--bone);
  font-family: 'Manrope', system-ui, sans-serif;
  line-height: 1.65;
}

a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--ember); outline-offset: 6px; }


.hero {
  position: relative;
  min-height: 100vh;
  display: grid;
  place-items: center;
  text-align: center;
  overflow: hidden;
  padding: 5rem 1.5rem 7rem;
}

.hero video {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.55;
}

/* dark overlay so text stays readable */
.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at center, rgba(8,8,10,0.15), rgba(8,8,10,0.72) 70%),
    linear-gradient(to bottom, rgba(8,8,10,0.5), transparent 25%, transparent 70%, var(--void));
}

.intro { position: relative; z-index: 2; }

h1 {
  margin: 0;
  font-family: 'Unbounded', sans-serif;
  font-weight: 200;
  font-size: clamp(2.3rem, 9.5vw, 8rem);
  line-height: 1.02;
  letter-spacing: -0.03em;
}
h1 span { display: block; overflow: hidden; padding-bottom: 0.08em; }
h1 i {
  display: block;
  font-style: normal;
  transform: translateY(105%);
  animation: rise 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
h1 span:nth-child(2) i { animation-delay: 0.18s; font-weight: 300; }

@keyframes rise { to { transform: none; } }

/* fade-in text */
.fade { opacity: 0; animation: fadeIn 1.2s ease forwards; }
@keyframes fadeIn { to { opacity: 1; } }

.role   { margin: 2.2rem 0 0; font-size: clamp(1.05rem, 2.2vw, 1.45rem); font-weight: 300; color: var(--ember); animation-delay: 0.9s; }
.school { margin: 0.7rem 0 0; font-size: clamp(0.95rem, 1.7vw, 1.1rem); animation-delay: 1.1s; }
.place  { margin: 0.35rem 0 0; font-size: 0.9rem; color: var(--ash); animation-delay: 1.25s; }

/* Explore link (center-bottom) */
.explore {
  position: absolute;
  z-index: 2;
  left: 50%;
  bottom: 2rem;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.9rem;
  letter-spacing: 0.06em;
  animation-delay: 1.8s;
  transition: color 0.3s;
}
.explore:hover { color: var(--ember); }
.explore b { display: inline-block; font-weight: 400; animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(5px); } }

.explore::after {
  content: "";
  width: 1px;
  height: 3rem;
  background: linear-gradient(var(--ember), transparent);
  transition: height 0.35s;
}
.explore:hover::after { height: 4rem; }


.page { min-height: 100vh; padding: 2rem clamp(1.25rem, 6vw, 5rem) 5rem; }

.back {
  display: inline-block;
  margin-bottom: 4rem;
  color: var(--ash);
  transition: color 0.25s;
}
.back:hover { color: var(--ember); }

.wrap { max-width: 68rem; margin: 0 auto; }

h2 {
  margin: 0 0 3.5rem;
  font-family: 'Unbounded', sans-serif;
  font-weight: 300;
  font-size: clamp(1.7rem, 4vw, 2.9rem);
  letter-spacing: -0.02em;
}

.proj {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 1rem 3rem;
  padding: 2.2rem 0;
  border-top: 1px solid var(--line);
  transition: padding-left 0.4s, border-color 0.4s;
}
.proj:last-of-type { border-bottom: 1px solid var(--line); }
.proj:hover { padding-left: 1rem; border-top-color: var(--ember); }
.proj h3 { margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 300; font-size: clamp(1.15rem, 2.2vw, 1.6rem); }
.proj p { margin: 0 0 0.9rem; color: var(--ash); max-width: 34rem; }
.proj small { color: var(--ember); }

@media (max-width: 760px) {
  .proj { grid-template-columns: 1fr; }
}


@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .fade, h1 i { opacity: 1; transform: none; }
  .hero video { display: none; }
}
  </style>
  <script>
    alert("Welcome to my portfolio! Please explore my work and feel free to reach out.");
    document.documentElement.style.setProperty('--bone', '#f8f9fa');
  </script>
</head>
<body>

  <header class="hero">
    <video autoplay muted loop playsinline>
      <source src="resume_project.mp4" type="video/mp4">
    </video>

    <div class="intro">
      <h1>
        <span><i>Shaurya</i></span>
        <span><i>Chaudhary</i></span>
      </h1>
      <p class="role fade">Aspiring AI Full Stack Developer</p>
      <p class="school fade">Computer Science (CS) at KIET Deemed to be University</p>
      <p class="place fade">Ayodhya, Uttar Pradesh, India</p>
    </div>

   
  <a class="explore fade" href="home.html">
      <span>Explore My Work <b>-> </b></span>
    </a>
  </header>

</body>
</html>
